<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fortnite Stats – Home</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
</head>

<body>

<header>
    <div class="logo">Fortnite Stats</div>

    <div class="auth-buttons">
        <button id="loginBtn" class="btn">Login</button>
        <button id="logoutBtn" class="btn" style="display:none;">Logout</button>
    </div>
</header>

<section class="hero">
    <h1>Track Your Fortnite Performance</h1>
    <p>Sign in to access personalized match stats, player history, and performance analytics.</p>
</section>

<section id="profileSection" class="profile-container">
    <h2>Welcome back!</h2>
    <div class="username-display">
        Logged in as: <span id="userDisplay"></span>
    </div>
</section>

<section id="fnSection" class="fn-container">
    <h2>Link Your Fortnite Username</h2>
    <input type="text" id="fnInput" placeholder="Enter Fortnite username">
    <button class="btn" id="saveFnBtn">Save</button>
    <div id="fnStatus" class="status"></div>
</section>

<script>
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const profileSection = document.getElementById("profileSection");
const userDisplay = document.getElementById("userDisplay");
const fnSection = document.getElementById("fnSection");
const fnInput = document.getElementById("fnInput");
const saveFnBtn = document.getElementById("saveFnBtn");
const fnStatus = document.getElementById("fnStatus");

let currentProfile = null;

function getIdToken() {
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    return params.get("id_token");
}

const idToken = getIdToken();

// LOGIN
loginBtn.onclick = () => {
    const url = `${window.APP_CONFIG.DOMAIN}/login?client_id=${window.APP_CONFIG.CLIENT_ID}&response_type=token&redirect_uri=${encodeURIComponent(window.APP_CONFIG.REDIRECT)}`;
    window.location.href = url;
};

// LOGOUT
logoutBtn.onclick = () => {
    const logoutUrl = `${window.APP_CONFIG.DOMAIN}/logout?client_id=${window.APP_CONFIG.CLIENT_ID}&logout_uri=${encodeURIComponent(window.APP_CONFIG.REDIRECT)}`;
    window.location.href = logoutUrl;
};

async function loadProfile() {
    try {
        const res = await fetch(window.APP_CONFIG.BACKEND_URL + "/profile", {
            headers: {
                "Authorization": "Bearer " + idToken
            }
        });
        const data = await res.json();
        currentProfile = data;

        // Display some name
        const fallbackName = data.user_name || data.user_id || "Unknown user";
        userDisplay.textContent = fallbackName;

        // Pre-fill Fortnite username from gameid
        fnInput.value = data.gameid || "";
    } catch (e) {
        console.error("Failed to load profile", e);
        fnStatus.textContent = "Failed to load profile";
    }
}

async function saveFortniteUsername() {
    if (!idToken) return;
    fnStatus.textContent = "Saving...";

    const body = {
        user_name: (currentProfile && currentProfile.user_name) || null,
        gameid: fnInput.value
    };

    try {
        const res = await fetch(window.APP_CONFIG.BACKEND_URL + "/profile", {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + idToken
            },
            body: JSON.stringify(body)
        });
        const data = await res.json();
        fnStatus.textContent = "Saved!";
        currentProfile = data.user;
    } catch (e) {
        console.error("Failed to save Fortnite username", e);
        fnStatus.textContent = "Error saving username";
    }
}

if (idToken) {
    // Logged in
    loginBtn.style.display = "none";
    logoutBtn.style.display = "inline-block";
    profileSection.style.display = "block";
    fnSection.style.display = "block";

    loadProfile();
}

saveFnBtn.onclick = saveFortniteUsername;
</script>

</body>
</html>
